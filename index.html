<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>To do, done · todo-project003</title>
    <meta name="description" content="A 2022 to-do list, rebuilt: Linear's calm rows, and a career you grow by finishing what you planned." />
    <meta name="theme-color" content="#0b0c0d" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@1&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" />
    <!-- The loader paints before the app's CSS arrives, so its rules live here (board T-07 frame 01): ring turns in, the pie fills, the title rises, the spark lands. -->
    <style>
      .loader { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #0b0c0d; color: #ece8e1; font-family: 'Schibsted Grotesk', system-ui, sans-serif; transition: opacity 0.2s ease; }
      .loader[data-leaving] { opacity: 0; }
      .loader-mark { display: grid; justify-items: center; gap: 14px; }
      .loader-wedge { stroke-dasharray: 0 100; animation: loader-fill 1.1s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards; }
      .loader-ring { transform-origin: 32px 32px; animation: loader-ring 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      .loader-spark { opacity: 0; transform-origin: 32px 32px; animation: loader-spark 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 1.15s forwards; }
      .loader-title { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; opacity: 0; transform: translateY(8px); animation: loader-rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards; }
      .loader-title em { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; }
      @keyframes loader-fill { to { stroke-dasharray: 100 0; } }
      @keyframes loader-ring { from { transform: rotate(-120deg) scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes loader-spark { from { opacity: 0; transform: scale(0.2) rotate(-45deg); } to { opacity: 1; transform: none; } }
      @keyframes loader-rise { to { opacity: 1; transform: none; } }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body class="min-h-dvh bg-ground font-display text-cream antialiased">
    <div id="loader" class="loader" aria-hidden="true">
      <div class="loader-mark">
        <svg width="72" height="72" viewBox="0 0 64 64"><circle class="loader-ring" cx="32" cy="32" r="28" fill="none" stroke="#ece8e1" stroke-opacity="0.35" stroke-width="3" /><circle class="loader-wedge" cx="32" cy="32" r="11" fill="none" stroke="#ff5a2c" stroke-width="22" pathLength="100" transform="rotate(-90 32 32)" /><path class="loader-spark" d="M32 22 L34.2 29.8 L42 32 L34.2 34.2 L32 42 L29.8 34.2 L22 32 L29.8 29.8 Z" fill="#0b0c0d" /></svg>
        <p class="loader-title">To do, <em>done</em></p>
      </div>
    </div>
    <div id="app"></div>
    <noscript><p class="p-6 text-sm">This list needs JavaScript. <a class="underline" href="./legacy/index.html">The 2022 version</a> needs it too, but less.</p></noscript>
  </body>
</html>
